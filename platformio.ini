; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; WiFi + BLE + U8g2 + CC1101 birlikte varsayılan OTA'lı partition şemasına
; (1.31MB app) sığmıyor; OTA'yı feda edip tek büyük app bölümü (~3MB) veren
; standart şemaya geçiyoruz.
board_build.partitions = huge_app.csv
build_flags =
	-Iinclude
; chain (varsayılan) modu, private lib'ler arasındaki çapraz include'ları
; (örn. command_protocol.h -> lib/BleScanner/ble_scanner.h) her zaman
; çözemiyor; deep+ tüm lib/ alt klasörlerini tara ve include yoluna ekler.
lib_ldf_mode = deep+
lib_deps =
	bblanchon/ArduinoJson@^7.0
	olikraus/U8g2@^2.35
	lsatan/SmartRC-CC1101-Driver-Lib@^3.0.2
